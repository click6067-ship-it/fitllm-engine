name: verify-install-paths

# 배포 경로를 **실제로 설치해서** 확인한다. 이 레포의 테스트는 엔진 수학을 지키지만,
# "brew install 이 되는가"는 그걸로 알 수 없다 — formula 의 URL·sha256 이 릴리스 자산과
# 어긋나거나, tap 이 안 올라가 있거나, 바이너리가 그 플랫폼에서 안 돌 수 있다.
#
# macOS 를 특히 보는 이유: 리눅스 경로는 개발 머신에서 직접 확인되지만 macOS 는 안 된다.
# arm64 Mac 이 이 도구의 주 사용자층이기도 하다.
#
# 릴리스마다 + 주 1회 돈다. 매 push 마다 돌리지 않는 건 macOS 러너가 느리고 비싸서고,
# 이 검증이 잡는 건 push 가 아니라 **릴리스 자산과 패키징의 어긋남**이라 주기가 맞다.

on:
  release:
    types: [published]
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  brew-tap:
    name: brew install from the tap
    runs-on: macos-latest
    steps:
      - name: Install from the tap
        run: |
          set -eux
          brew tap click6067-ship-it/fitllm
          # 현행 Homebrew 는 서드파티 tap 의 formula 를 명시적 신뢰 없이는 로드하지 않는다
          # (2026-09-22 실측: "Refusing to load formula ... from untrusted tap").
          # 사용자가 실제로 쳐야 하는 줄이므로 검증도 그 줄을 포함해야 한다.
          brew trust click6067-ship-it/fitllm
          brew install fitllm

      - name: The binary runs and the verdict is the expected one
        run: |
          set -eux
          out="$(fitllm 'Gemma 4 31b' --gpu 'RTX 4090' || true)"
          printf '%s\n' "$out"
          # 24GB 카드에 31B dense 는 빠듯하다 — 이 판정이 바뀌면 배포된 엔진이 우리 것이 아니다.
          printf '%s' "$out" | grep -q 'TIGHT'
          printf '%s' "$out" | grep -q 'Gemma 4 31b'

      - name: Exit contract still holds (0 fits/tight, 1 will not fit)
        run: |
          set -eu
          fitllm 'Gemma 4 31b' --gpu 'RTX 4090' >/dev/null
          echo "tight exited 0"
          if fitllm 'Qwen 3.8 2.4T-A95B' --gpu 'RTX 4090' >/dev/null; then
            echo "expected a non-zero exit for a model that cannot fit" >&2
            exit 1
          fi
          echo "no-fit exited non-zero"

  install-script:
    name: curl pipe sh on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install via the published script
        run: |
          set -eux
          curl -fsSL https://fitllm.run/install.sh | FITLLM_INSTALL_DIR="$RUNNER_TEMP/bin" sh
          "$RUNNER_TEMP/bin/fitllm" 'Gemma 4 31b' --gpu 'RTX 5090' | tee "$RUNNER_TEMP/out.txt"
          grep -q 'FITS' "$RUNNER_TEMP/out.txt"

      - name: A tampered download is refused and nothing is written
        run: |
          set -eu
          # 체크섬 검증이 실제로 도는지 확인한다. 스텁 curl 이 바이너리 URL 에만
          # 쓰레기를 주고 .sha256 은 진짜를 통과시킨다 — 불일치가 강제된다.
          mkdir -p "$RUNNER_TEMP/stub" "$RUNNER_TEMP/tamper"
          cat > "$RUNNER_TEMP/stub/curl" <<'STUB'
          #!/bin/sh
          for a in "$@"; do case "$a" in *releases/download/*fitllm-v*) TAMPER=1;; esac; done
          case "$*" in *.sha256*) TAMPER="";; esac
          if [ -n "${TAMPER:-}" ]; then
            out=""; next=""
            for a in "$@"; do [ "$next" = "1" ] && { out="$a"; next=""; }; [ "$a" = "-o" ] && next=1; done
            printf 'TAMPERED' > "$out"; exit 0
          fi
          exec /usr/bin/curl "$@"
          STUB
          chmod +x "$RUNNER_TEMP/stub/curl"
          if PATH="$RUNNER_TEMP/stub:$PATH" FITLLM_INSTALL_DIR="$RUNNER_TEMP/tamper" \
               sh -c 'curl -fsSL https://fitllm.run/install.sh | sh'; then
            echo "installer accepted a tampered binary" >&2
            exit 1
          fi
          if [ -e "$RUNNER_TEMP/tamper/fitllm" ]; then
            echo "installer wrote a binary despite the checksum mismatch" >&2
            exit 1
          fi
          echo "tampered download refused, nothing written"

  ollama-scan:
    name: fitllm scan against a real Ollama
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # scan 의 유닛테스트는 픽스처를 쓴다. 픽스처는 "우리가 생각하는 Ollama" 를 증명할 뿐
      # "진짜 Ollama" 를 증명하지 못한다 — 개발 머신에 Ollama 가 없어서 그 간극이 계속 남는다.
      # 이 job 이 그 간극을 닫는다.
      - name: Install and start Ollama
        run: |
          set -eux
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags

      - name: Pull a model this catalog knows
        run: ollama pull qwen3:0.6b

      - name: scan finds it and maps it to the catalog
        run: |
          set -eux
          node bin/fitllm.mjs scan | tee "$RUNNER_TEMP/scan.txt"
          grep -q 'qwen3:0.6b' "$RUNNER_TEMP/scan.txt"
          # 매핑이 실제로 붙는지가 핵심 — 목록만 나오고 판정이 안 붙으면 반쪽이다.
          grep -q 'Qwen3-0.6B' "$RUNNER_TEMP/scan.txt"

      - name: --json carries the same facts and the schema holds
        run: |
          set -eu
          node bin/fitllm.mjs scan --json > "$RUNNER_TEMP/scan.json"
          node -e '
            const s = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/scan.json", "utf8"));
            const ollama = s.providers.find((p) => p.provider === "ollama");
            if (!ollama || ollama.ok !== true) throw new Error("ollama provider did not answer");
            const hit = ollama.models.find((m) => m.installedId === "qwen3:0.6b");
            if (!hit) throw new Error("scan did not see the pulled model");
            if (hit.catalogModel !== "Qwen3-0.6B") throw new Error("catalog mapping failed: " + hit.catalogModel);
            if (!Number.isFinite(hit.reported.sizeBytes) || hit.reported.sizeBytes <= 0) {
              throw new Error("runtime-reported size missing");
            }
            if (/tok\/s/i.test(JSON.stringify(s))) throw new Error("speed claim leaked into scan output");
            console.log("ok:", hit.installedId, "->", hit.catalogModel, hit.reported.sizeBytes, "bytes");
          '

      - name: measure --from-ollama recovers what the runtime reports
        run: |
          set -eux
          # 모델을 실제로 로드해야 /api/ps 에 올라온다. 짧은 생성 한 번으로 상주시킨다.
          ollama run qwen3:0.6b "hi" --keepalive 5m >/dev/null 2>&1 || true
          curl -fsS http://127.0.0.1:11434/api/ps | tee "$RUNNER_TEMP/ps.json"
          node bin/fitllm.mjs measure --from-ollama --json > "$RUNNER_TEMP/measure.json"
          cat "$RUNNER_TEMP/measure.json"
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/measure.json", "utf8"));
            const ps = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/ps.json", "utf8"));
            // 러너에는 GPU 가 없다. 그러면 size_vram 이 0 이고 게이트가 거부해야 한다 —
            // 거부되는 것이 정답인 환경이므로, 여기서 검증하는 것은 "거부가 조용히
            // 통과로 바뀌지 않는가" 다.
            const loaded = (ps.models || []).length;
            if (loaded > 0 && r.ok) {
              const vramZero = ps.models.every((m) => !m.size_vram);
              if (vramZero && r.candidates.length > 0) {
                throw new Error("gate leaked: produced a VRAM measurement with size_vram=0");
              }
              console.log("loaded:", loaded, "candidates:", r.candidates.length, "skipped:", r.skipped.length);
            } else {
              console.log("nothing loaded or runtime unavailable:", r.note || "");
            }
            if (/tok\/s/i.test(JSON.stringify(r))) throw new Error("speed claim leaked");
          '

      - name: scan exits 0 even when nothing fits
        run: |
          set -eu
          node bin/fitllm.mjs scan >/dev/null
          echo "scan exited 0 (a lookup is not a verdict)"
