name: day0-watch

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run은 읽기 전용, apply-issues만 최대 3개 issue create/update'
        required: true
        type: choice
        options:
          - dry-run
          - apply-issues
        default: dry-run

concurrency:
  group: day0-watch-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.event_name == 'schedule' || inputs.mode != 'apply-issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Read-only freshness scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run day0:dry-run

  apply-issues:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply-issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Build pure evidence and issue plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/day0-watch.mjs --plan --output-dir "$RUNNER_TEMP/day0"
      - name: Upload immutable review evidence
        id: evidence
        if: steps.plan.outputs.mutations != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fitllm-day0-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/day0
          retention-days: 30
          overwrite: false
      - name: Apply issue-only plan after upload
        if: steps.plan.outputs.mutations != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          DAY0_MODE: apply-issues
          DAY0_ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          DAY0_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: node .github/scripts/day0-watch.mjs --apply-issues --plan "$RUNNER_TEMP/day0/issue-plan.json"
