name: 📏 Measured memory report
description: Report real measured memory usage to help calibrate FitLLM (estimated vs measured).
title: "[measured] <model> @ <RAM>GB <bits>-bit"
labels: ["measurement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping calibrate FitLLM! Fill in what you measured on your own machine.
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: e.g. Qwen/Qwen3-32B, Gemma 4 31B
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Exact hardware identity
      placeholder: e.g. RTX 4090 or M5 Max 64GB
    validations:
      required: true
  - type: input
    id: quant
    attributes:
      label: Quantization
      placeholder: e.g. Q4_K_M, 8bit, FP16
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Context length (tokens)
      placeholder: e.g. 32768
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and exact version/commit
      placeholder: e.g. llama.cpp b6400, Ollama 0.12.3, MLX 0.29.1
    validations:
      required: true
  - type: input
    id: measured
    attributes:
      label: Measured peak memory (value)
      placeholder: e.g. 53.2
    validations:
      required: true
  - type: dropdown
    id: measurement_kind
    attributes:
      label: What exactly was measured?
      options:
        - idle_resident
        - load_peak
        - generation_peak
        - system_total_peak
    validations:
      required: true
  - type: dropdown
    id: unit
    attributes:
      label: Unit
      options:
        - GiB
        - GB
    validations:
      required: true
  - type: input
    id: kv_bits
    attributes:
      label: KV cache precision
      placeholder: 16, 8, or 4 bits
    validations:
      required: true
  - type: textarea
    id: command_and_artifact
    attributes:
      label: Exact command, flags, and raw evidence
      description: Include a log or screenshot link and say whether prefill/decode completed.
    validations:
      required: true
  - type: input
    id: estimate
    attributes:
      label: FitLLM estimate (GB) — optional
      placeholder: what FitLLM showed
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
